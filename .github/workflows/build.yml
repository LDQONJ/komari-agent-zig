name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        run: |
          set -eu
          bash scripts/install_zig_ci.sh "zig-x86_64-linux-${ZIG_VERSION}.tar.xz" "${ZIG_SHA256}"
      - name: Run unit tests
        run: zig build test

  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            target: x86_64-linux-musl
          - os: linux
            arch: arm64
            target: aarch64-linux-musl
          - os: windows
            arch: amd64
            target: x86_64-windows-gnu
          - os: windows
            arch: arm64
            target: aarch64-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        run: |
          set -eu
          bash scripts/install_zig_ci.sh "zig-x86_64-linux-${ZIG_VERSION}.tar.xz" "${ZIG_SHA256}"
      - name: Build binary
        run: |
          set -eu
          VERSION="${GITHUB_SHA::7}"
          zig build -Doptimize=ReleaseSmall -Dversion="${VERSION}" -Dtarget=${{ matrix.target }}
          mkdir -p dist
          binary="komari-agent"
          asset="komari-agent-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            binary="komari-agent.exe"
            asset="${asset}.exe"
          fi
          cp "zig-out/bin/${binary}" "dist/${asset}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: komari-agent-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/komari-agent-${{ matrix.os }}-${{ matrix.arch }}*
          if-no-files-found: error
